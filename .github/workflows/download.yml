name: Download and Release Deb

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Ubuntu 版本'
        required: true
        default: '22.04'
        type: choice
        options:
          - '22.04'
          - '20.04'
          - '24.04'
          - '18.04'
      package_name:
        description: '软件包名称 (如 curl, nginx, docker-ce)'
        required: true
        type: string
      custom_dockerfile:
        description: '使用的 Dockerfile / 源 (留空默认官方源，可选: Dockerfile.china, Dockerfile_nginx 等)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 执行离线下载与依赖打包
        id: run_download
        env:
          UBUNTU_VER: ${{ github.event.inputs.ubuntu_version }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          CUSTOM_DF: ${{ github.event.inputs.custom_dockerfile }}
        run: |
          chmod +x download.sh
          if [ -n "${CUSTOM_DF}" ]; then
            bash download.sh "${UBUNTU_VER}" "${PACKAGE_NAME}" "${CUSTOM_DF}"
          else
            bash download.sh "${UBUNTU_VER}" "${PACKAGE_NAME}"
          fi
          
          TAR_FILE="${PACKAGE_NAME}-${UBUNTU_VER}.tar.gz"
          if [ ! -f "${TAR_FILE}" ]; then
            echo "::error::未找到打包生成的文件: ${TAR_FILE}"
            exit 1
          fi
          echo "tar_file=${TAR_FILE}" >> "$GITHUB_OUTPUT"

      - name: 发布 Release 并上传附件
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UBUNTU_VER: ${{ github.event.inputs.ubuntu_version }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          TAR_FILE: ${{ steps.run_download.outputs.tar_file }}
        run: |
          TAG_NAME="v_${PACKAGE_NAME}_${UBUNTU_VER//./_}_${{ github.run_number }}"
          TITLE="deb: ${PACKAGE_NAME} (Ubuntu ${UBUNTU_VER})"
          NOTES="### 离线安装说明\n\n\`\`\`bash\nmkdir -p /tmp/debs && tar -zxvf ${TAR_FILE} -C /tmp/debs\ncd /tmp/debs && sudo dpkg -i *.deb\n\`\`\`"
          
          gh release create "${TAG_NAME}" "${TAR_FILE}" \
            --title "${TITLE}" \
            --notes "$(echo -e "${NOTES}")"
          
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${TAR_FILE}"
          
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"

          # 写入 Actions 运行总结页面，方便直接点击下载
          echo "### 软件包离线打包完成" >> $GITHUB_STEP_SUMMARY
          echo "- **软件包**: \`${PACKAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **目标系统**: \`Ubuntu ${UBUNTU_VER}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **下载直链**: [点击直接下载 ${TAR_FILE}](${DOWNLOAD_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Release 详情页**: [查看 Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 目标机器离线安装命令" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "mkdir -p /tmp/debs && tar -zxvf ${TAR_FILE} -C /tmp/debs" >> $GITHUB_STEP_SUMMARY
          echo "cd /tmp/debs && sudo dpkg -i *.deb" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
